<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume — Liam O'Neill</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #F7F7F5;
      --ink:    #1C1C1A;
      --muted:  #7A7A76;
      --white:  #FFFFFF;
      --serif:  'Cormorant Garamond', Georgia, serif;
      --sans:   'DM Sans', system-ui, sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 300;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Nav ─────────────────────────────────────────────── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(247, 247, 245, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .nav-home {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: 0.01em;
    }

    .nav-back {
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-back:hover { color: var(--ink); }

    /* ─── Page header ─────────────────────────────────────── */
    .page-header {
      padding: 120px 40px 32px;
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .page-title {
      font-family: var(--serif);
      font-style: italic;
      font-weight: 300;
      font-size: clamp(36px, 5vw, 60px);
      line-height: 1.0;
      letter-spacing: -0.02em;
    }

    .download-btn {
      display: inline-block;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      text-decoration: none;
      border: 1px solid rgba(28,28,26,0.25);
      padding: 10px 24px;
      letter-spacing: 0.02em;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }

    .download-btn:hover {
      background: var(--ink);
      color: var(--white);
      border-color: var(--ink);
    }

    /* ─── PDF wrapper + clip ──────────────────────────────── */
    .pdf-wrapper {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 40px 0;
    }

    /*
      .pdf-clip hides the black bar the browser renders at the
      bottom of the PDF embed. It clips the iframe at 1095px
      while the iframe itself is taller (1155px). If the bottom
      of your resume content is cut off, increase BOTH numbers
      by the same amount.
    */
    .pdf-clip {
      overflow: hidden;
      height: 1095px;
    }

    .pdf-embed {
      width: 100%;
      height: 1155px;
      border: none;
      display: block;
      background: var(--white);
    }

    /* ─── Back to home nav ────────────────────────────────── */
    .page-nav {
      max-width: 900px;
      margin: 0 auto;
      padding: 48px 40px 56px;
      border-top: 1px solid rgba(28,28,26,0.10);
    }

    .page-nav a {
      text-decoration: none;
      display: inline-block;
    }

    .page-nav-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .page-nav-title {
      font-size: 15px;
      font-weight: 400;
      color: var(--ink);
      transition: color 0.2s;
    }

    .page-nav a:hover .page-nav-title { color: var(--muted); }

    /* ─── Footer ──────────────────────────────────────────── */
    footer {
      padding: 28px 40px 48px;
      max-width: 900px;
      margin: 0 auto;
      border-top: 1px solid rgba(28,28,26,0.10);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-links { display: flex; gap: 24px; }

    .footer-links a {
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-links a:hover { color: var(--ink); }
    footer small { font-size: 12px; color: var(--muted); }

    /* ─── Mobile ──────────────────────────────────────────── */
    @media (max-width: 700px) {
      nav { padding: 16px 20px; }
      .page-header { flex-direction: column; align-items: flex-start; gap: 20px; padding: 100px 20px 24px; }
      .pdf-wrapper { padding: 0; }
      .pdf-clip { height: 500px; }
      .pdf-embed { height: 560px; }
      .page-nav { padding: 40px 20px 48px; }
      footer { flex-direction: column; gap: 12px; align-items: flex-start; padding: 24px 20px 40px; }
    }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-home">Liam O'Neill</a>
  <a href="/" class="nav-back">← Back</a>
</nav>

<div class="page-header">
  <h1 class="page-title">Resume</h1>
  <a href="resume.pdf" download="Liam_ONeill_Resume.pdf" class="download-btn">Download PDF ↓</a>
</div>

<div class="pdf-wrapper">
  <div class="pdf-clip">
    <iframe
      src="resume.pdf#toolbar=0&navpanes=0&view=FitH"
      class="pdf-embed"
      scrolling="no"
      title="Liam O'Neill Resume">
    </iframe>
  </div>
</div>

<!-- ─── Back to home ──────────────────────────────────────── -->
<div class="page-nav">
  <a href="/">
    <p class="page-nav-label">← Back to</p>
    <p class="page-nav-title">All Work</p>
  </a>
</div>

<!-- ─── Footer ───────────────────────────────────────────── -->
<footer>
  <nav class="footer-links">
    <a href="mailto:oneill.m.liam@gmail.com">Email</a>
    <a href="https://www.linkedin.com/in/liam-o-neill-b923a3294/" target="_blank" rel="noopener">LinkedIn</a>
  </nav>
  <small>© 2026 Liam O'Neill</small>
</footer>

</body>
</html>
